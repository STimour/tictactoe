<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title>Neo Tic Tac Toe Icon</title>
  <desc>Rounded futuristic XO mark with neon glow.</desc>
  <defs>
    <radialGradient id="bg" cx="30%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0b1220" />
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect x="20" y="20" width="472" height="472" rx="80" fill="url(#bg)" />
  <rect x="26" y="26" width="460" height="460" rx="76" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="4" />
  <g filter="url(#glow)" font-family="'Comforter Brush', 'Brush Script MT', cursive" font-size="240" font-weight="700" text-anchor="middle" dominant-baseline="central" transform="translate(256 256)">
    <text x="-70" y="30" fill="#22d3ee" stroke="#0ea5e9" stroke-width="6">X</text>
    <text x="120" y="30" fill="#a855f7" stroke="#7e22ce" stroke-width="6">O</text>
  </g>
</svg>
